name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm avatars:check
      - run: pnpm build

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: comicle
          POSTGRES_PASSWORD: comicle
          POSTGRES_DB: comicle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comicle -d comicle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://comicle:comicle@localhost:5432/comicle_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: comicle
          POSTGRES_PASSWORD: comicle
          POSTGRES_DB: comicle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comicle -d comicle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: comicle
          POSTGRES_PASSWORD: comicle
          POSTGRES_DB: comicle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comicle -d comicle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: The EC2 compose refuses to start without its settings
        working-directory: infra/ec2
        run: |
          settings='COMICLE_IMAGE=comicle:ci ORIGIN_HOST=origin.example.com POSTGRES_PASSWORD=x'
          for missing in COMICLE_IMAGE ORIGIN_HOST POSTGRES_PASSWORD; do
            if env $(tr ' ' '\n' <<<"$settings" | grep -v "^$missing=") \
              docker compose config --quiet 2>/dev/null; then
              echo "the compose started without $missing"
              exit 1
            fi
          done
          env $settings docker compose config --quiet
      - name: The EC2 Caddyfile is valid
        working-directory: infra/ec2
        env:
          COMICLE_IMAGE: comicle:ci
          ORIGIN_HOST: origin.example.com
          POSTGRES_PASSWORD: x
        run: |
          mkdir certs
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
            -subj "/CN=$ORIGIN_HOST" -keyout certs/origin.key -out certs/origin.pem
          caddy_image=$(docker compose config --images | grep '^caddy:')
          docker run --rm -e ORIGIN_HOST -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/certs:/certs:ro" "$caddy_image" caddy validate --config /etc/caddy/Caddyfile
      - name: Build the production image
        run: docker build -t comicle:ci .
      - name: Start the container
        run: >-
          docker run -d --name comicle --network host
          -e DATABASE_URL=postgres://comicle:comicle@localhost:5432/comicle
          comicle:ci
      - name: /healthz answers
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs comicle
          exit 1
      - name: The web build is served, with the fallback for client routes
        run: curl -fsS http://localhost:3000/sala/K7PQ2M | grep -q '<div id="root">'
      - name: SIGTERM stops it cleanly in under 10 s
        run: |
          start=$(date +%s)
          docker stop --time 10 comicle
          elapsed=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' comicle)
          echo "stopped in ${elapsed}s with exit code ${code}"
          docker logs comicle | tail -n 5
          test "$code" = 0 && test "$elapsed" -lt 10
